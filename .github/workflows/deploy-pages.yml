name: Deploy presentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out presentation
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage only the public presentation
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/presentation"
          cp docs/index.html "$RUNNER_TEMP/presentation/index.html"
          cp docs/workshop-qr.png "$RUNNER_TEMP/presentation/workshop-qr.png"

      - name: Upload presentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/presentation

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
